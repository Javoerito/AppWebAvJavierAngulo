<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0F">
  <title>WebChat · Red Dark Premium</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ====== Pantalla de ingreso (Firebase Authentication) ====== -->
  <div class="login" id="login-screen">
    <form class="login__card" id="login-form" autocomplete="on" novalidate>
      <div class="logo logo--lg" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <h1 class="login__title">WebChat</h1>
      <p class="login__subtitle">Inicia sesión para entrar a la conversación.</p>

      <div class="tabs" role="tablist" aria-label="Acceso">
        <button class="tabs__btn is-active" id="tab-login" type="button" role="tab" aria-selected="true">Iniciar sesión</button>
        <button class="tabs__btn" id="tab-register" type="button" role="tab" aria-selected="false">Crear cuenta</button>
      </div>

      <div class="field" id="field-username" hidden>
        <label class="login__label" for="username-input">Nombre de usuario</label>
        <input class="login__input" id="username-input" type="text" maxlength="20" placeholder="Ej: Javier" autocomplete="nickname">
      </div>

      <div class="field">
        <label class="login__label" for="email-input">Correo</label>
        <input class="login__input" id="email-input" type="email" placeholder="tu@correo.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="login__label" for="password-input">Contraseña</label>
        <input class="login__input" id="password-input" type="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password" required>
      </div>

      <p class="login__error" id="login-error" role="alert"></p>

      <button class="btn btn--primary" id="login-btn" type="submit">Iniciar sesión</button>
    </form>
  </div>

  <!-- ====== Aplicación ====== -->
  <div class="app" id="app">

    <!-- Panel lateral -->
    <aside class="sidebar" id="sidebar" aria-label="Usuarios conectados">
      <div class="sidebar__head">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="brand__text">
            <strong>WebChat</strong>
            <span>Red Dark Premium</span>
          </div>
        </div>
        <button class="icon-btn sidebar__close" id="sidebar-close" type="button" aria-label="Cerrar panel de usuarios">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="sidebar__title">
        <h2>Conectados</h2>
        <span class="count-pill" id="sidebar-count">0</span>
      </div>

      <ul class="user-list" id="user-list"></ul>
    </aside>

    <div class="backdrop" id="sidebar-backdrop"></div>

    <!-- Conversación -->
    <main class="chat">
      <header class="chat__header">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Abrir panel de usuarios" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <div class="logo logo--header" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </div>

        <div class="chat__identity">
          <h1>WebChat</h1>
          <div class="status-line">
            <span class="conn" id="conn-status" data-state="reconnecting" role="status" aria-live="polite">
              <span class="conn__dot"></span>
              <span class="conn__label" id="conn-label">Conectando…</span>
            </span>
            <span class="status-line__sep" aria-hidden="true"></span>
            <span class="online-count" id="online-count">0 en línea</span>
          </div>
        </div>

        <button class="icon-btn theme-btn" id="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro" title="Cambiar tema">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <button class="icon-btn" id="logout-btn" type="button" aria-label="Cerrar sesión" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </header>

      <section class="chat__body">
        <div class="messages" id="messages" aria-live="polite" aria-label="Mensajes del chat"></div>

        <div class="empty" id="empty-state">
          <div class="empty__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          </div>
          <h3>Aún no hay mensajes</h3>
          <p>Escribe el primero y empieza la conversación.</p>
        </div>
      </section>

      <div class="typing" id="typing-indicator" aria-live="polite">
        <span class="typing__dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="typing__text" id="typing-text"></span>
      </div>

      <form class="composer" id="composer" autocomplete="off" novalidate>
        <div class="composer__row">
          <div class="composer__field" id="composer-field">
            <textarea id="message-input" rows="1" placeholder="Escribe un mensaje…" aria-label="Escribe un mensaje" enterkeyhint="send"></textarea>
          </div>
          <button class="send-btn" id="send-btn" type="submit" aria-label="Enviar mensaje" title="Enviar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
        <div class="composer__meta">
          <span class="composer__hint">Enter envía · Shift + Enter agrega una línea</span>
          <span class="char-counter" id="char-counter">0/500</span>
        </div>
      </form>
    </main>
  </div>

  <!-- Notificaciones del sistema -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
